# local-dev/docker-compose.yml
# Application services: base-services + sample-services
# Note: Depends on infrastructure services from docker-compose.infra.yml
# Start infrastructure first, then services

services:
  auth-callout:
    build:
      context: ../base-services/auth-callout
      dockerfile: Dockerfile.local
    container_name: nexus-auth-callout
    environment:
      - JWT_ACC_SIGNING_KEY=${JWT_ACC_SIGNING_KEY}
      - KEYCLOAK_JWK_B64=${KEYCLOAK_JWK_B64}
      - NATS_URL=${NATS_URL}
      - NATS_USER=auth-callout-service
      - NATS_PASSWORD=auth-callout-pass
      - LOG_LEVEL=DEBUG
    networks:
      - nexus-local

  data-api:
    build:
      context: ../
      dockerfile: base-services/data-api/Dockerfile.local
    container_name: nexus-data-api
    environment:
      - GRPC_ADDR=${GRPC_ADDR}
      - BIGTABLE_EMULATOR_HOST=${BIGTABLE_EMULATOR_HOST}
      - GCP_PROJECT=${GCP_PROJECT}
      - BT_INSTANCE=${BT_INSTANCE}
      - BT_TABLE=${BT_TABLE}
      - LOG_LEVEL=debug
    ports:
      - "9090:8080"
    networks:
      - nexus-local

  data-converter:
    build:
      context: ../
      dockerfile: base-services/data-converter/Dockerfile.local
    container_name: nexus-data-converter
    environment:
      - CONFIG_PATH=${CONFIG_PATH}
      - NATS_HOST=${NATS_HOST}
      - MQTT_HOST=${MQTT_HOST}
      - NATS_TOKEN=${NATS_TOKEN}
      - NATS_USER=connector
      - NATS_PASSWORD=connector-pass
    volumes:
      - ./config/data-converter.yaml:/config/config.yaml:ro
    networks:
      - nexus-local

  registration:
    build:
      context: ../base-services/registration/server
      dockerfile: Dockerfile.local
    container_name: nexus-registration
    environment:
      - REG_SERVER_CERT=${REG_SERVER_CERT}
      - REG_SERVER_KEY=${REG_SERVER_KEY}
      - REG_CA_CERT=${REG_CA_CERT}
      - REG_CA_KEY=${REG_CA_KEY}
      - FACTORY_CA_CERT=${FACTORY_CA_CERT}
      # Host-reachable URLs registration echoes back to clients (e.g.
      # sample-clients/vehicle-client running on the host) - distinct from
      # the in-Docker-network NATS_URL auth-callout/data-converter use.
      - NATS_URL=${REG_CLIENT_NATS_URL}
      - KEYCLOAK_URL=${REG_CLIENT_KEYCLOAK_URL}
    ports:
      - "8444:8443"  # HTTPS (maps to 8444 to avoid conflict with Keycloak)
      - "8888:8888"  # HTTP health
    volumes:
      - ./certs/registration:/certs/registration:ro
      - ./certs/registration:/certificates:ro
    networks:
      - nexus-local

  data-api-sampler:
    build:
      context: ../sample-services/data-api-sampler
      dockerfile: Dockerfile.local
      network: host  # Maven Central (Cloudflare) is unreachable on the BuildKit bridge net; host egress works
    container_name: nexus-data-api-sampler
    environment:
      - DATA_API_URL=${DATA_API_GRPC_ADDR}
    depends_on:
      - data-api
    networks:
      - nexus-local

  trip-analyzer:
    build:
      context: ../sample-services/trip_analyzer
      dockerfile: Dockerfile.local
    container_name: nexus-trip-analyzer
    environment:
      - DATA_API_GRPC_ADDR=${DATA_API_GRPC_ADDR}
    depends_on:
      - data-api
    networks:
      - nexus-local

  nats-bigtable-connector:
    build:
      context: ../base-services/nats-bigtable-connector
      dockerfile: Dockerfile.local
    container_name: nexus-nats-bigtable-connector
    environment:
      - NATS_URL=nats://connector:connector-pass@nats:4222
      - BIGTABLE_EMULATOR_HOST=bigtable-emulator:8086
      - GCP_PROJECT=test-project
      - BT_INSTANCE=test-instance
      - BT_TABLE=telemetry
    networks:
      - nexus-local

  telemetry-chart-service:
    build:
      context: ../sample-services/telemetry-chart-service
      dockerfile: Dockerfile.local
      network: host  # Maven Central (Cloudflare) is unreachable on the BuildKit bridge net; host egress works
    container_name: nexus-telemetry-chart-service
    environment:
      - BIGTABLE_PROJECT_ID=test-project
      - BIGTABLE_INSTANCE_ID=test-instance
      - BIGTABLE_TABLE_NAME=telemetry
      - BIGTABLE_EMULATOR_HOST=bigtable-emulator:8086
    ports:
      - "8081:8080"
    networks:
      - nexus-local

  data-web-client:
    build:
      context: ../sample-clients/data-web-client
      dockerfile: Dockerfile.local
      args:
        TELEMETRY_SERVICE_URL: http://telemetry-chart-service:8080
    container_name: nexus-data-web-client
    environment:
      - NEXTAUTH_SECRET=local-dev-secret-change-in-production
      - NEXTAUTH_URL=http://localhost:3000
      - KEYCLOAK_CLIENT_ID=nexus-web-client
      - KEYCLOAK_CLIENT_SECRET=local-dev-secret
      - KEYCLOAK_ISSUER=http://localhost:8080/realms/nexus-sdv
      - BIGTABLE_PROJECT_ID=test-project
      - BIGTABLE_INSTANCE_ID=test-instance
      - BIGTABLE_EMULATOR_HOST=bigtable-emulator:8086
      - NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=
      - NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID=
      - TELEMETRY_SERVICE_URL=http://telemetry-chart-service:8080
    ports:
      - "3000:3000"
    depends_on:
      - telemetry-chart-service
    networks:
      - nexus-local

networks:
  nexus-local:
    external: true