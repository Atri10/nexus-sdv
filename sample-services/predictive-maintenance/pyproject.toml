[project]
name = "predictive-maintenance"
version = "0.1.0"
description = "Predictive maintenance prototype: PM message contract and detector service."
readme = "README.md"
authors = [
    { name = "Atriya Patel", email = "atriya.patel@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "betterproto[compiler]>=2.0.0b6",
    "grpcio-tools>=1.62.0",
    "protobuf>=4.25.0",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
