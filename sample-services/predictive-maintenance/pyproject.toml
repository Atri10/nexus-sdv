[project]
name = "predictive-maintenance"
version = "0.1.0"
description = "Predictive maintenance prototype: PM message contract and detector service."
readme = "README.md"
authors = [
    { name = "Atriya Patel", email = "atriya.patel@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic-settings>=2.2.0",
    "structlog>=24.0.0",
    "apscheduler>=3.11.2",
    "nats-py>=2.7.0",
    "grpclib>=0.4.7",
    "betterproto>=2.0.0b6",
    "protobuf>=4.25.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "httpx>=0.27.0",
    "betterproto[compiler]>=2.0.0b6",
    "grpcio-tools>=1.62.0",
    "protobuf>=4.25.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
log_cli = true
log_cli_level = "INFO"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
